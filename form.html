<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share your experience with a product and help others choose what works for them.">
    <meta name="author" content="Acidri Abdulrazak">
    <title>Product Review | WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header class="site-header">
        <p>WDD 131 <span>Product Reviews</span></p>
    </header>

    <main>
        <section class="form-card" aria-labelledby="page-title">
            <div class="page-intro">
                <p class="eyebrow">Your feedback matters</p>
                <h1 id="page-title">Product Review</h1>
                <p>Tell us about the product you installed. Fields marked with <span aria-hidden="true">*</span> are required.</p>
            </div>

            <form action="review.html" method="get">
                <div class="form-field">
                    <label for="product-name">Product Name <span aria-hidden="true">*</span></label>
                    <select id="product-name" name="product" required>
                        <option value="" disabled selected>Select a Product ...</option>
                    </select>
                </div>

                <fieldset class="form-field">
                    <legend>Overall Rating <span aria-hidden="true">*</span></legend>
                    <div class="rating-options">
                        <div class="rating-option">
                            <input type="radio" id="rating-1" name="rating" value="1" required>
                            <label for="rating-1"><span aria-hidden="true">☆</span> 1 star</label>
                        </div>
                        <div class="rating-option">
                            <input type="radio" id="rating-2" name="rating" value="2" required>
                            <label for="rating-2"><span aria-hidden="true">☆☆</span> 2 stars</label>
                        </div>
                        <div class="rating-option">
                            <input type="radio" id="rating-3" name="rating" value="3" required>
                            <label for="rating-3"><span aria-hidden="true">☆☆☆</span> 3 stars</label>
                        </div>
                        <div class="rating-option">
                            <input type="radio" id="rating-4" name="rating" value="4" required>
                            <label for="rating-4"><span aria-hidden="true">☆☆☆☆</span> 4 stars</label>
                        </div>
                        <div class="rating-option">
                            <input type="radio" id="rating-5" name="rating" value="5" required>
                            <label for="rating-5"><span aria-hidden="true">☆☆☆☆☆</span> 5 stars</label>
                        </div>
                    </div>
                </fieldset>

                <div class="form-field">
                    <label for="installation-date">Date of Installation <span aria-hidden="true">*</span></label>
                    <input type="date" id="installation-date" name="installation-date" required>
                </div>

                <fieldset class="form-field">
                    <legend>Useful Features</legend>
                    <p class="field-help">Select all the features you found useful.</p>
                    <div class="checkbox-options">
                        <label for="feature-durable">
                            <input type="checkbox" id="feature-durable" name="features" value="Durability">
                            Durability
                        </label>
                        <label for="feature-easy">
                            <input type="checkbox" id="feature-easy" name="features" value="Ease of use">
                            Ease of use
                        </label>
                        <label for="feature-performance">
                            <input type="checkbox" id="feature-performance" name="features" value="Performance">
                            Performance
                        </label>
                        <label for="feature-design">
                            <input type="checkbox" id="feature-design" name="features" value="Design">
                            Design
                        </label>
                    </div>
                </fieldset>

                <div class="form-field">
                    <label for="written-review">Written Review <span class="optional">(optional)</span></label>
                    <textarea id="written-review" name="written-review" rows="5"></textarea>
                </div>

                <div class="form-field">
                    <label for="user-name">Your Name <span class="optional">(optional)</span></label>
                    <input type="text" id="user-name" name="user-name" autocomplete="name">
                </div>

                <input class="submit-button" type="submit" value="Submit Review">
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>© <span id="currentyear"></span> Acidri Abdulrazak | Entebbe, Uganda</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
