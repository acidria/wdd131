  <title>Temple Album | WDD 131</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">
  <script src="scripts/temples.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <a class="site-title" href="#temples">Temple Album</a>
      <button class="menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation">
        <span class="menu-icon" aria-hidden="true">☰</span>
      </button>
    </div>
    <nav aria-label="Main navigation">
      <ul class="navigation" id="primary-navigation">
        <li><a href="#temples" aria-current="page">Home</a></li>
        <li><a href="#temples">Old</a></li>
        <li><a href="#temples">New</a></li>
        <li><a href="#temples">Large</a></li>
        <li><a href="#temples">Small</a></li>
      </ul>
    </nav>
  </header>

  <main id="temples">
    <h1>Temples Around the World</h1>
    <div class="temple-grid">
      <figure class="temple-card">
        <img src="images/salt-lake.jpg" alt="The Salt Lake Temple rising above Temple Square" width="500" height="698" loading="lazy">
        <figcaption>
          <h2>Salt Lake Temple</h2>
          <p>Salt Lake City, Utah · Dedicated 1893</p>
          <span class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:Salt_Lake_Temple_UT2.jpg" target="_blank" rel="noopener noreferrer">Acroterion</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a></span>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/rome.jpg" alt="A domed interior with a statue of Christ inside the Rome Italy Temple" width="500" height="357" loading="lazy">
        <figcaption>
          <h2>Rome Italy Temple</h2>
          <p>Rome, Italy · Dedicated 2019</p>
          <span class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:LDS_Rome_Temple_2.jpg" target="_blank" rel="noopener noreferrer">NateBergin</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a></span>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/tokyo.jpg" alt="The Tokyo Japan Temple on a rainy day" width="500" height="667" loading="lazy">
        <figcaption>
          <h2>Tokyo Japan Temple</h2>
          <p>Tokyo, Japan · Dedicated 1980</p>
          <span class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:Tokyo_LDS_Temple_by_opencontent.jpeg" target="_blank" rel="noopener noreferrer">David Wiley</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener noreferrer">CC BY 2.0</a></span>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/washington-dc.jpg" alt="The Washington D.C. Temple illuminated at dusk" width="500" height="340" loading="lazy">
        <figcaption>
          <h2>Washington D.C. Temple</h2>
          <p>Kensington, Maryland · Dedicated 1974</p>
          <span class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:Washington_D.C._Temple_At_Dusk.jpg" target="_blank" rel="noopener noreferrer">Joe Ravi</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a></span>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/laie.jpg" alt="The entrance to the Laie Hawaii Temple" width="500" height="374" loading="lazy">
        <figcaption>
          <h2>Laie Hawaii Temple</h2>
          <p>Laie, Hawaii · Dedicated 1919</p>
          <a class="photo-credit" href="https://commons.wikimedia.org/wiki/File:LDS_Laie_Hawaii_Temple_entrance.jpg" target="_blank" rel="noopener noreferrer">Photo: Gh5046 · Public domain</a>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/nauvoo.jpg" alt="The Nauvoo Illinois Temple glowing at dusk" width="500" height="400" loading="lazy">
        <figcaption>
          <h2>Nauvoo Illinois Temple</h2>
          <p>Nauvoo, Illinois · Dedicated 2002</p>
          <span class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:Nauvoo_Illinois_Temple,_At_Dusk.jpg" target="_blank" rel="noopener noreferrer">Altus Photo Design</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noopener noreferrer">CC BY 2.0</a></span>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/bern.jpg" alt="The Bern Switzerland Temple set among green trees" width="500" height="667" loading="lazy">
        <figcaption>
          <h2>Bern Switzerland Temple</h2>
          <p>Zollikofen, Switzerland · Dedicated 1955</p>
          <a class="photo-credit" href="https://commons.wikimedia.org/wiki/File:LDS_Bern_Switzerland_Temple.jpg" target="_blank" rel="noopener noreferrer">Photo: MTPICHON · Public domain</a>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/provo.jpg" alt="The Provo City Center Temple at twilight" width="500" height="333" loading="lazy">
        <figcaption>
          <h2>Provo City Center Temple</h2>
          <p>Provo, Utah · Dedicated 2016</p>
          <span class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:Provo_City_Center_LDS_Temple_time-lapse_video.webm" target="_blank" rel="noopener noreferrer">Century Media</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a></span>
        </figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/twin-falls.jpg" alt="The Twin Falls Idaho Temple surrounded by a winter garden" width="500" height="664" loading="lazy">
        <figcaption>
          <h2>Twin Falls Idaho Temple</h2>
          <p>Twin Falls, Idaho · Dedicated 2008</p>
          <span class="photo-credit">Photo: <a href="https://commons.wikimedia.org/wiki/File:Winter_garden_Twin_Falls_Idaho_Temple.jpg" target="_blank" rel="noopener noreferrer">Bobjgalindo</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a></span>
        </figcaption>
      </figure>
    </div>
    <p class="image-note">Temple photographs are credited to their creators. Select a photo credit to view its source and license.</p>
  </main>

</html>
